name: Build N64 ROM
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Libdragon
        uses: dragonminded/libdragon@v1
        with:
          run: |
            mips64-elf-gcc -g -O2 -march=vr4300 -mabi=32 -o my_game.elf main.c -ldragon -lc -lm -ldragonsys
            n64tool -l 2M -t "My Game" my_game.z64 my_game.elf
            chksum64 my_game.z64

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: n64-rom
          path: "my_game.z64"
