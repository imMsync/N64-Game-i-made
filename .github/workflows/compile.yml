name: Build N64 ROM
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/dragonminded/libdragon:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Game ROM
        run: |
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          mips64-elf-gcc -O2 -std=gnu99 -march=vr4300 -mabi=32 -o my_game.elf main.c -ldragon -lc -lm -ldragonsys
          n64tool -l 2M -t "My Game" -h /opt/libdragon/mips64-elf/lib/header my_game.z64 my_game.elf || n64tool -l 2M -t "My Game" my_game.z64 my_game.elf
          chksum64 my_game.z64

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: n64-rom
          path: "my_game.z64"
